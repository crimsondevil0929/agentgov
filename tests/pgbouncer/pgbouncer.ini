; PgBouncer in transaction mode, in front of the test server, for the suite's
; run behind a pooler (.github/workflows/ci.yml, job "pgbouncer"). @HOST@ and
; @PORT@ are filled in where it starts. A small pool makes clients share
; server connections, so anything left on a session reaches another client;
; no prepared statements are tracked, so a statement prepared on one server
; connection is unknown on the next.
[databases]
* = host=@HOST@ port=@PORT@

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
auth_user = agentgov_admin
auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename=$1
pool_mode = transaction
default_pool_size = 4
max_client_conn = 500
query_wait_timeout = 30
max_prepared_statements = 0
