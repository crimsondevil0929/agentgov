[project]
name = "agentgov"
version = "0.1.1"
description = "Runtime spend governor and denial-of-wallet circuit breaker for autonomous agent fleets."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Edward Gu", email = "edwardgu0929@gmail.com" }]
keywords = [
    "agents",
    "llm",
    "budget",
    "cost-control",
    "circuit-breaker",
    "denial-of-wallet",
    "ledger",
    "governance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# 1.63 is the version the dashboard was built and verified against (it uses
# st.dataframe's `width="stretch"` sizing API); an older floor risked pinning
# to a version where that parameter doesn't exist.
ui = ["streamlit>=1.63"]

[project.scripts]
agentgov = "agentgov.cli:main"

[project.urls]
Homepage = "https://github.com/crimsondevil0929/agentgov"
Repository = "https://github.com/crimsondevil0929/agentgov"
Issues = "https://github.com/crimsondevil0929/agentgov/issues"
Changelog = "https://github.com/crimsondevil0929/agentgov/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    # Used only by scripts/generate_real_usage.py, which exercises the metering
    # path against the live Anthropic API. A dependency *group* is local to this
    # repository and is not published in the wheel, so the installed package
    # keeps its zero-runtime-dependency guarantee.
    "anthropic>=1.0.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "N",   # pep8-naming
    "S",   # flake8-bandit (financial-code hygiene: no asserts/eval/etc. in prod paths)
    "RUF", # ruff-specific rules
]
ignore = ["S101"]  # allow assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["agentgov"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
